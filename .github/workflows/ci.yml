name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libxdo-dev \
            pkg-config

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install npm dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test (frontend)
        run: npm test

      - name: Build (frontend)
        run: npm run build

      - name: Rust format check
        working-directory: src-tauri
        run: cargo fmt --all --check

      - name: Rust clippy
        working-directory: src-tauri
        run: cargo clippy --workspace -- -D warnings

      - name: Rust tests
        working-directory: src-tauri
        run: cargo test --workspace

  core-windows:
    name: Core crate (Windows)
    runs-on: windows-latest

    steps:
      - name: Check out sources byte-for-byte (Git for Windows sets autocrlf system-wide)
        run: git config --system core.autocrlf false

      - name: Checkout
        uses: actions/checkout@v4

      # The suite must pass under Git for Windows' default (GR-33): the fixtures
      # pin autocrlf per repository, so the host setting must not matter.
      - name: Restore Git for Windows' default autocrlf
        run: git config --system core.autocrlf true

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Rust clippy (core)
        working-directory: src-tauri
        run: cargo clippy -p git-real-core --all-targets -- -D warnings

      - name: Rust tests (core)
        working-directory: src-tauri
        run: cargo test -p git-real-core --no-fail-fast

  package-linux:
    name: Package (Linux)
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libxdo-dev \
            pkg-config \
            file \
            patchelf

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install npm dependencies
        run: npm ci

      - name: Build Linux bundles
        run: npm run tauri build -- --bundles deb,rpm,appimage

      - name: Upload bundles
        uses: actions/upload-artifact@v4
        with:
          name: git-real-linux-${{ github.sha }}
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
            src-tauri/target/release/bundle/appimage/*.AppImage
          retention-days: 14
          if-no-files-found: error

  package-windows:
    name: Package (Windows)
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install npm dependencies
        shell: bash
        run: npm ci

      - name: Build Windows bundles
        shell: bash
        run: npm run tauri build -- --bundles nsis,msi

      - name: Upload bundles
        uses: actions/upload-artifact@v4
        with:
          name: git-real-windows-${{ github.sha }}
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          retention-days: 14
          if-no-files-found: error

  package-macos:
    name: Package (macOS)
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install npm dependencies
        run: npm ci

      - name: Prepare Apple signing
        run: .github/scripts/apple-signing-env.sh

      - name: Build macOS disk image
        run: npm run tauri build -- --target universal-apple-darwin --bundles dmg

      - name: Upload bundles
        uses: actions/upload-artifact@v4
        with:
          name: git-real-macos-${{ github.sha }}
          path: src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          retention-days: 14
          if-no-files-found: error

  bench:
    name: Benchmarks (large repositories)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Build the benchmark harness
        working-directory: src-tauri
        run: cargo build --release -p git-real-bench
      - name: Restore benchmark fixtures
        uses: actions/cache@v4
        with:
          path: ~/.cache/git-real-bench
          key: git-real-bench-fixtures-v1-${{ hashFiles('src-tauri/crates/git-real-bench/src/fixtures.rs', 'src-tauri/crates/git-real-bench/src/cli.rs') }}
      - name: Prepare fixtures
        run: |
          src-tauri/target/release/git-real-bench prepare synthetic ~/.cache/git-real-bench/synthetic
          src-tauri/target/release/git-real-bench prepare public-graph ~/.cache/git-real-bench/qemu-graph
          src-tauri/target/release/git-real-bench prepare public-worktree ~/.cache/git-real-bench/qemu-worktree
      - name: Run benchmarks
        run: >
          src-tauri/target/release/git-real-bench run
          ~/.cache/git-real-bench/synthetic
          ~/.cache/git-real-bench/qemu-graph
          ~/.cache/git-real-bench/qemu-worktree
          --json bench-results.json --summary "$GITHUB_STEP_SUMMARY"
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bench-results-${{ github.sha }}
          path: bench-results.json
          retention-days: 30
          if-no-files-found: ignore
