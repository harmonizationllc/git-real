name: Release

on:
  push:
    tags: ["v*"]

concurrency:
  group: release-${{ github.ref }}

jobs:
  check-version:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check the tag matches the app version
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#v}"
          conf="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          test "$tag" = "$conf" || { echo "tag v$tag != tauri.conf.json $conf"; exit 1; }
          [[ "$tag" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9]+)?$ ]] || { echo "version $tag must be X.Y.Z or X.Y.Z-N; the Windows MSI accepts only a numeric pre-release identifier"; exit 1; }

  build-linux:
    runs-on: ubuntu-22.04
    needs: check-version

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libxdo-dev \
            pkg-config \
            file \
            patchelf

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install npm dependencies
        run: npm ci

      - name: Build Linux bundles
        run: npm run tauri build -- --bundles deb,rpm,appimage

      - name: Upload bundles
        uses: actions/upload-artifact@v4
        with:
          name: release-linux
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
            src-tauri/target/release/bundle/appimage/*.AppImage
          retention-days: 1
          if-no-files-found: error

  build-windows:
    runs-on: windows-latest
    needs: check-version

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install npm dependencies
        shell: bash
        run: npm ci

      - name: Build Windows bundles
        shell: bash
        run: npm run tauri build -- --bundles nsis,msi

      - name: Upload bundles
        uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          retention-days: 1
          if-no-files-found: error

  publish:
    runs-on: ubuntu-latest
    needs: [build-linux, build-windows]
    permissions:
      contents: write

    steps:
      - name: Download the built bundles
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: release-assets

      - name: Publish the GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: Git Real ${{ github.ref_name }}
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          fail_on_unmatched_files: true
          files: |
            release-assets/*.deb
            release-assets/*.rpm
            release-assets/*.AppImage
            release-assets/*.exe
            release-assets/*.msi
