[package]
name = "git-real-core"
version = "0.1.0"
description = "Pure Git domain logic for Git Real, independent of Tauri"
authors = ["Jason Harmon <23158200+harmonizationllc@users.noreply.github.com>"]
license = "GPL-3.0-only"
edition = "2024"

[lib]
name = "git_real_core"

[dependencies]
git2 = { version = "0.20", default-features = false }
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "3", default-features = false, features = ["rustls", "json"] }

[dev-dependencies]
tempfile = "3"
