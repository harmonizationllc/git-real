[workspace]
members = ["crates/git-real-core", "crates/git-real-bench"]
resolver = "3"

[package]
name = "git-real"
version = "0.1.0"
description = "Git Real, a lightweight desktop Git client"
authors = ["Jason Harmon <23158200+harmonizationllc@users.noreply.github.com>"]
license = "GPL-3.0-only"
repository = "https://github.com/harmonizationllc/git-real"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "git_real_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
git-real-core = { path = "crates/git-real-core" }
thiserror = "2"
notify = "8"
keyring = { version = "3", features = ["sync-secret-service", "crypto-rust", "apple-native", "windows-native"] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[dev-dependencies]
tempfile = "3"
git2 = { version = "0.20", default-features = false }
